<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<style>
    .login{
        background-color:gray;
        background-position: center;
        background-size: cover;
        text-align: center;
        height: 500px;
        width: 400px;
        border-radius: 20px;
        border: 1px solid;
        text-transform: uppercase;

    }
    form{
        display:block;
        padding: 20%;
        box-sizing: border-box;
        flex-direction: column;
        display: flex;
        gap: 5px;
   
    }
    h1{
        font-size: 50px;
        margin-bottom: 20px;
    }
    label{
        color:cornsilk;
        
        text-transform: capitalize;

    }
    input{
        color:brown;
    }
    button{
        font-size: 20px;
        padding: auto;
       height: 40px;
       line-height: 40px;
       border-radius: 40px;
       border:cornsilk solid;
       margin: 10px 0px;
      
       
    }
</style>

<body>
    <div class="login">
    <form>
        <h1>Login</h1>
        <label>Name</label>
        <input type="text">
        <label>Email</label>
        <input type="text">
        <button>Submit</button>

    </form>
</div>
    
</body>
</html>
