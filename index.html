<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation bar</title>
    <style>
        
body {
  margin: 0;
  font-family: Arial, sans-serif;
}


navbar {
  background-color: #333;
  padding: 10px 0;
}


navbar ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex; 
  justify-content: center; 
}


navbar li {
  margin: 0 20px;
}


navbar a {
  color: black;
  text-decoration: none;
  font-size: 18px;
  padding: 8px 12px;
  transition: background 0.3s;
}

navbar a:hover {
  background-color: #575757;
  border-radius: 4px;
}


    </style>
</head>
<body>
    <navbar>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
            
        </ul>
    </navbar>
    
</body>
</html>
